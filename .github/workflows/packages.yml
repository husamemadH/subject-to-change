name: Desktop packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install Linux Qt and media libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libpulse0 ffmpeg
      - name: Prepare Windows media DLLs
        if: runner.os == 'Windows'
        run: uv run --no-project python packaging/prepare_ffmpeg.py
      - name: Install GPU-capable inference runtime and packaging tools
        run: uv sync --frozen --extra model --extra package
      - run: uv run --frozen --extra model --extra package python packaging/build.py
      - name: Test frozen launcher, indexing, Stop, resume, device probe and media decoders
        run: uv run --frozen --extra model --extra package python packaging/check.py --media
      - uses: actions/upload-artifact@v4
        with:
          name: subject-to-change-${{ runner.os }}
          path: dist/subject-to-change/
          if-no-files-found: error
