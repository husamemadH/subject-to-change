[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "subject-to-change"
version = "0.1.0"
description = "Search your chosen folders locally, by meaning and exact words."
requires-python = ">=3.11,<3.15"
dependencies = [
    "PySide6>=6.8,<7",
    "pypdf>=6,<7",
]

[project.optional-dependencies]
model = ["sentence-transformers>=5.1,<6", "huggingface-hub>=0.34,<2"]
dev = ["ruff>=0.12,<1"]
package = ["pyinstaller>=6.15,<7"]

[project.scripts]
subject-to-change = "subject_to_change.cli:main"

[project.gui-scripts]
subject-to-change-desktop = "subject_to_change.ui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/subject_to_change"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
