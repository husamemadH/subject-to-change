[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "subject-to-change"
version = "0.1.0"
description = "Search your chosen folders locally, by meaning and exact words."
requires-python = ">=3.11,<3.15"
dependencies = [
    "PySide6>=6.8,<7",
    "pypdf>=6,<7",
]

[project.optional-dependencies]
model = ["sentence-transformers>=6.1,<7", "transformers>=5.18,<6", "huggingface-hub>=1,<2", "sentencepiece>=0.2,<1", "pillow>=12,<14", "torch>=2.14,<3", "torchvision>=0.25,<1", "torchcodec>=0.14,<1", "soundfile>=0.13,<1"]
dev = ["ruff>=0.12,<1"]
package = ["pyinstaller>=6.15,<7"]

[project.scripts]
subject-to-change = "subject_to_change.cli:main"

[project.gui-scripts]
subject-to-change-desktop = "subject_to_change.launch:main"

[tool.hatch.build.targets.wheel]
packages = ["src/subject_to_change"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.uv.sources]
torch = { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }
torchvision = { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }
torchcodec = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
